# Builds the image on Cloud Build. Referenced by deploy/deploy.sh.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/Dockerfile
      - --tag=${_IMAGE}:${_TAG}
      - --tag=${_IMAGE}:latest
      # Reuse layers from the last build so a code-only change does not reinstall
      # every dependency.
      - --cache-from=${_IMAGE}:latest
      - .

images:
  - '${_IMAGE}:${_TAG}'
  - '${_IMAGE}:latest'

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
