<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Measure Pressure — keep track of your blood pressure</title>
    <meta name="description" content="Photograph your Omron blood pressure monitor and the numbers are written down for you. How to put it on your phone." />
    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!--
      The preview card WhatsApp draws when the link is pasted into a chat. Without
      these it shows a bare URL, which is exactly what a scam link looks like to
      someone who is being careful. Absolute URLs: WhatsApp fetches these from its
      own servers, where a relative path means nothing.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://measurepressure.web.app/" />
    <meta property="og:title" content="Measure Pressure" />
    <meta
      property="og:description"
      content="Photograph your Omron blood pressure monitor and the numbers are written down for you. How to put it on your phone."
    />
    <meta property="og:image" content="https://measurepressure.web.app/icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
