<!--
  The source the app icons are drawn from. Everything else - iOS, Android, the
  favicons, the splash, the picture in the landing page's install guide - is a
  PNG rendered from this file by `npm run icons`.

  Full bleed and square on purpose: iOS and Android round the corners themselves,
  and an icon that arrives pre-rounded gets rounded twice.

  The trace is one stroke with round caps, heavy enough (7.5 units of 100) to hold
  together at 60px on a home screen, which is the only size that really matters.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc4fb"/>
      <stop offset="1" stop-color="#1f6fd0"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#ground)"/>
  <path d="M13 55 H33 L39.5 39 L48 71 L56 28 L63 55 H87"
        fill="none" stroke="#ffffff" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
