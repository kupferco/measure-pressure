<!--
  The trace on its own, no background.

  Used where the platform supplies the ground itself: Android's adaptive icon
  (which composites a foreground over a background layer and then masks the pair
  to whatever shape the launcher wants), Android's monochrome themed icon, and
  the splash screen, which paints app.json's backgroundColor behind it.

  Scaled to 85% and centred, because Android's mask can crop anything outside the
  middle 66% of the canvas - a full-bleed foreground would lose the ends of the
  trace on a circular launcher.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <g transform="translate(50 50) scale(0.85) translate(-50 -49.5)">
    <path d="M13 55 H33 L39.5 39 L48 71 L56 28 L63 55 H87"
          fill="none" stroke="#ffffff" stroke-width="7.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
