<!--
  The same mark as the app's icon, drawn as SVG because this one only ever appears
  in a browser tab. See apps/app/assets/icon.svg for the source the PNGs come from.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc4fb"/>
      <stop offset="1" stop-color="#1f6fd0"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#ground)"/>
  <path d="M13 55 H33 L39.5 39 L48 71 L56 28 L63 55 H87"
        fill="none" stroke="#ffffff" stroke-width="8.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
